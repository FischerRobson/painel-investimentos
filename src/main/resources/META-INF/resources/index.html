<!doctype html>
<html lang="pt-BR">
<head>

<title>Meus Investimentos</title>

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --border: #e3e2de;
  --grid: #ecebe7;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #8a8984;
  --accent: #2a78d6;
  --good: #0a8a0a;
  --bad: #d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c85; --accent: #3987e5;
    --good: #2fbf2f; --bad: #e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --grid: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c85; --accent: #3987e5;
  --good: #2fbf2f; --bad: #e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--text-3); font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.controls input[type=text] {
  flex: 1 1 360px; min-width: 0; padding: 9px 12px; font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
}
button {
  font: inherit; cursor: pointer; padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
}
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 8px 12px; color: var(--text-2); }
.seg button.on { background: var(--text); color: var(--surface); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.panel h2 { font-size: 15px; margin: 0 0 2px; }
.panel .hint { color: var(--text-3); font-size: 12px; margin-bottom: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 10px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.legend span.off { opacity: .35; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.cmp-box { position: relative; height: 320px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--grid); }
th { color: var(--text-3); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th.sorted::after { content: " ▾"; }
th.sorted.asc::after { content: " ▴"; }
tbody tr:hover { background: var(--grid); }
.tk { font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.up { color: var(--good); } .down { color: var(--bad); }
.muted { color: var(--text-3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
@media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card-head .name { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-2); }
.price { white-space: nowrap; font-size: 26px; font-weight: 700; letter-spacing: -.02em; text-align: right; line-height: 1.1; }
.chg { font-size: 13px; font-weight: 600; text-align: right; }
.x { background: none; border: 0; color: var(--text-3); padding: 0 0 0 6px; font-size: 18px; line-height: 1; }
.mini { position: relative; height: 150px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 12px; }
.stat .k { font-size: 11px; color: var(--text-3); }
.stat .v { font-size: 14px; font-weight: 600; }
.range52 { font-size: 11px; color: var(--text-3); }
.bar52 { position: relative; height: 4px; border-radius: 2px; background: var(--grid); margin: 5px 0 3px; }
.bar52 b { position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--text); border: 2px solid var(--surface); transform: translateX(-50%); }
.bar52-l { display: flex; justify-content: space-between; }
details summary { cursor: pointer; color: var(--text-2); font-size: 12px; font-weight: 600; }
.divbox { position: relative; height: 120px; margin-top: 8px; }
.about { font-size: 12px; color: var(--text-2); margin-top: 6px; max-height: 120px; overflow: auto; }
.err { color: var(--bad); font-size: 13px; }
.logo { width: 22px; height: 22px; border-radius: 5px; object-fit: contain; background: #fff; }
.status { color: var(--text-3); font-size: 12px; }
#save-state.erro { color: var(--bad); font-weight: 600; }
.head-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.nav { display: flex; gap: 4px; margin: 0 0 18px; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 10px 16px; color: var(--text-2); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.nav a:hover { color: var(--text); }
.nav a.on { color: var(--text); border-bottom-color: var(--accent); }
[hidden] { display: none !important; }
/* iPhone: respeita notch e barra inferior; a faixa do topo fica escura para o relógio/bateria (texto branco) aparecer */
body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.wrap { padding-top: calc(20px + env(safe-area-inset-top)); }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #111110; z-index: 60; }
.offline { background: color-mix(in srgb, var(--s4) 22%, var(--surface)); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; padding: 9px 12px; margin: 0 0 14px; font-size: 13px; }
.nav a svg { display: none; }
@media (max-width: 700px) {
  .wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  header .sub { display: none; }
  .head-r { align-items: flex-start; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; margin: 0; gap: 0; justify-content: space-around;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); border-bottom: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); overflow: visible; }
  .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; font-size: 10.5px;
    border-bottom: 0; margin: 0; color: var(--text-3); -webkit-tap-highlight-color: transparent; }
  .nav a.on { color: var(--accent); border-bottom: 0; }
  .nav a svg { display: block; width: 22px; height: 22px; }
  .controls input[type=text] { flex-basis: 100%; }
}
a { color: var(--accent); }
.w-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 14px; }
.tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: 11px; color: var(--text-3); }
.tile .v { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.tile .s { font-size: 12px; color: var(--text-2); }
.w-table th, .w-table td { padding: 8px 7px; }
.w-table .alloc .track { width: 56px; }
.w-table td:last-child { padding-right: 0; }
.w-table td input { width: 90px; padding: 5px 8px; font: inherit; text-align: right; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
.alloc { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.alloc .track { width: 90px; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.alloc .fill { height: 100%; background: var(--accent); border-radius: 3px; }
.w-add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.w-add input { padding: 8px 10px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.w-add input[name=t] { width: 130px; text-transform: uppercase; }
.w-add input[name=q] { width: 120px; }
.mix { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin-top: 6px; }
.mix span { display: block; height: 100%; }
.mix-l { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 6px; font-size: 11px; color: var(--text-2); }
.mix-l span { display: inline-flex; align-items: center; gap: 4px; }
.mix-l i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.w-actions { display: flex; flex-wrap: wrap; gap: 8px; }
details.acc { border-top: 1px solid var(--border); margin-top: 14px; }
details.acc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 2px; user-select: none; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::before { content: "▸"; color: var(--text-3); transition: transform .15s; display: inline-block; width: 12px; }
details.acc[open] > summary::before { transform: rotate(90deg); }
.acc-t { font-weight: 700; font-size: 14px; color: var(--text); }
.acc-s { color: var(--text-3); font-size: 12px; margin-left: auto; text-align: right; }
.panel > details.acc:first-child { border-top: 0; margin-top: 0; }
.panel > details.acc:first-child > summary { padding-top: 0; }
.dist { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; margin: 4px 0 6px; }
.pie-box { position: relative; width: 220px; height: 220px; flex: none; }
.pie-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.pie-center .k { font-size: 11px; color: var(--text-3); }
.pie-center .v { font-size: 15px; font-weight: 700; }
.pie-legend { flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px; max-width: 460px; }
.pl-row { display: grid; grid-template-columns: 12px 1fr auto 56px; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: default; outline: none; }
.pl-row:hover, .pl-row:focus { background: var(--grid); }
.pl-row i { width: 12px; height: 12px; border-radius: 3px; }
.pl-name { font-weight: 600; } .pl-val { font-weight: 600; } .pl-pct { color: var(--text-3); text-align: right; }
#bk-tip { position: fixed; z-index: 50; display: none; width: 340px; max-width: calc(100vw - 16px); max-height: 70vh; overflow: auto; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); pointer-events: none; font-size: 13px; }
.bk-h { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 4px; }
.bk-h i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.bk-h span { margin-left: auto; font-weight: 600; color: var(--text-2); font-size: 12px; }
.bk-n { color: var(--text-3); font-size: 11px; margin-bottom: 6px; }
.bk-r { display: grid; grid-template-columns: 1fr auto 46px; gap: 2px 10px; padding: 5px 0; border-top: 1px solid var(--grid); }
.bk-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-v { text-align: right; } .bk-p { text-align: right; color: var(--text-3); }
.bk-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--grid); overflow: hidden; }
.bk-bar span { display: block; height: 100%; border-radius: 2px; }
.proj-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); align-items: end; }
.proj-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-3); }
.proj-form label input { width: 100%; min-width: 0; padding: 8px 10px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.proj-form label.chk { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); padding-bottom: 9px; }
.proj-form label.chk input { width: auto; }
.proj-form .quick { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.proj-form .quick button { padding: 5px 10px; font-size: 12px; }
.fx-have { display: flex; align-items: end; justify-content: space-between; gap: 10px; border-top: 1px solid var(--grid); padding-top: 10px; }
.fx-have label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-3); }
.fx-have input { width: 140px; padding: 7px 10px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
.fipe-form { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.fipe-form label input { margin-bottom: 4px; }
.fipe-result { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px; margin-top: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; }
.fipe-save { display: flex; flex-wrap: wrap; gap: 8px; }
.fipe-save input { padding: 8px 10px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-width: 220px; }
.proj-box { position: relative; height: 230px; margin: 4px 0 12px; }
.w-actions button:disabled { opacity: .45; cursor: default; }
tr.editing td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.panel h3 { font-size: 13px; margin: 18px 0 6px; color: var(--text-2); }
.w-add select { padding: 8px 10px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.rf-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-items: end; }
.rf-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-3); }
.rf-form label input, .rf-form label select { width: 100%; min-width: 0; }
.rf-form .pair { display: flex; gap: 6px; }
.rf-form button { white-space: nowrap; }
.rf-form .pair select { flex: 1.3; min-width: 0; } .rf-form .pair input { flex: 1; min-width: 0; }
.rf-form label.chk { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); padding-bottom: 9px; }
.rf-form label.chk input { width: auto; }
.loading { opacity: .55; pointer-events: none; transition: opacity .2s; }
/* Skeleton: blocos no formato do conteúdo com brilho passando */
.sk { display: block; border-radius: 6px; background: linear-gradient(90deg, var(--grid) 0%, var(--border) 50%, var(--grid) 100%);
  background-size: 300% 100%; animation: sk-shimmer 1.4s ease-in-out infinite; }
.sk-line { height: 12px; margin: 6px 0; }
.sk-title { height: 18px; width: 180px; margin-bottom: 10px; }
.sk-big { height: 26px; width: 60%; margin: 8px 0 4px; }
.sk-block { height: 100%; min-height: 120px; border-radius: 10px; }
.sk-circle { width: 200px; height: 200px; border-radius: 50%; flex: none;
  -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%); mask: radial-gradient(circle, transparent 62%, #000 63%); }
.sk-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.sk-row .sk { height: 12px; margin: 0; }
.sk-input { height: 36px; border-radius: 8px; }
.skel { pointer-events: none; }
@keyframes sk-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
/* Barra de progresso no topo durante atualizações */
#topbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; z-index: 100; opacity: 0; transition: opacity .2s; pointer-events: none; }
body.busy #topbar { opacity: 1; }
#topbar::before { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--accent); border-radius: 2px; animation: topbar 1.1s ease-in-out infinite; }
@keyframes topbar { from { left: -35%; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .sk, #topbar::before { animation: none; } #topbar::before { left: 0; width: 100%; opacity: .6; } }
</style>
</head>

// Valor estimado de um título de renda fixa "na curva", com CDI e IPCA reais do Banco Central
function rfCalc(e) {
  if (!rates) return null;
  const today = todayISO();
  const end = e.venc && e.venc < today ? e.venc : today;
  const days = rates.cdi.filter(([d]) => d >= e.data && d < end); // dias úteis com CDI
  const du = days.length;
  let f;
  if (e.idx === "cdi") f = days.reduce((acc, [, r]) => acc * (1 + (r / 100) * (e.taxa / 100)), 1);
  else if (e.idx === "pre") f = Math.pow(1 + e.taxa / 100, du / 252);
  else { // IPCA + taxa: IPCA dos meses completos após a aplicação
    const m0 = e.data.slice(0, 7), m1 = end.slice(0, 7);
    const ipca = rates.ipca.filter(([d]) => d.slice(0, 7) > m0 && d.slice(0, 7) < m1).reduce((acc, [, v]) => acc * (1 + v / 100), 1);
    f = ipca * Math.pow(1 + e.taxa / 100, du / 252);
  }
  const bruto = e.aplicado * f, rend = bruto - e.aplicado;
  const corridos = (new Date(end) - new Date(e.data)) / 864e5;
  const aliq = corridos <= 180 ? 0.225 : corridos <= 360 ? 0.20 : corridos <= 720 ? 0.175 : 0.15;
  const ir = e.isento ? 0 : Math.max(0, rend) * aliq;
  return { bruto, rend, ir, aliq: e.isento ? 0 : aliq, liquido: bruto - ir, venceu: end !== today };
}
const rfTaxa = e => e.idx === "cdi" ? `${brl(e.taxa, e.taxa % 1 ? 1 : 0)}% do CDI` : e.idx === "pre" ? `${brl(e.taxa)}% a.a.` : `IPCA + ${brl(e.taxa)}%`;

// ---------- Projeção da renda fixa ----------
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); };
const addMonths = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setMonth(d.getMonth() + n); return d.toLocaleDateString("sv-SE"); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
// Dias úteis (seg–sex) de a (inclusive) até b (exclusive). Não desconta feriados.
function weekdays(a, b) {
  const n = daysBetween(a, b);
  if (n <= 0) return 0;
  let count = Math.floor(n / 7) * 5;
  const start = new Date(a + "T12:00:00");
  for (let i = Math.floor(n / 7) * 7; i < n; i++) {
    const wd = (start.getDay() + i) % 7;
    if (wd !== 0 && wd !== 6) count++;
  }
  return count;
}
const aliqIR = dias => dias <= 180 ? 0.225 : dias <= 360 ? 0.20 : dias <= 720 ? 0.175 : 0.15;

// Premissas atuais: CDI anualizado do último dia e IPCA acumulado em 12 meses
function currentRates() {
  if (!rates) return null;
  const lastCdi = rates.cdi[rates.cdi.length - 1]?.[1] ?? 0;
  const ipca12 = rates.ipca.slice(-12).reduce((a, [, v]) => a * (1 + v / 100), 1);
  return { cdi: (Math.pow(1 + lastCdi / 100, 252) - 1) * 100, ipca: (ipca12 - 1) * 100 };
}
function projCfgEff() {
  const cur = currentRates() || { cdi: 0, ipca: 0 };
  return {
    target: projCfg.target && projCfg.target > todayISO() ? projCfg.target : addMonths(todayISO(), 12),
    cdi: projCfg.cdi ?? +cur.cdi.toFixed(2), ipca: projCfg.ipca ?? +cur.ipca.toFixed(2),
    reinvest: projCfg.reinvest !== false, cur,
  };
}

// Valor de um título numa data futura (líquido = o que você receberia resgatando nesse dia)
function projectOne(e, target, cfg) {
  const c = rfCalc(e);
  if (!c) return null;
  const today = todayISO();
  const rCdi = Math.pow(1 + cfg.cdi / 100, 1 / 252) - 1;
  let bruto, ir, liq, end;
  if (e.venc && e.venc <= today) { // já venceu
    end = e.venc; bruto = c.bruto; ir = c.ir; liq = c.liquido;
  } else {
    end = e.venc && e.venc < target ? e.venc : target;
    const du = weekdays(today, end);
    const f = e.idx === "cdi" ? Math.pow(1 + rCdi * e.taxa / 100, du)
      : e.idx === "pre" ? Math.pow(1 + e.taxa / 100, du / 252)
      : Math.pow((1 + cfg.ipca / 100) * (1 + e.taxa / 100), du / 252);
    bruto = c.bruto * f;
    ir = e.isento ? 0 : Math.max(0, bruto - e.aplicado) * aliqIR(daysBetween(e.data, end));
    liq = bruto - ir;
  }
  const venceAntes = end < target;
  if (venceAntes && cfg.reinvest) { // reaplica o líquido a 100% do CDI (tributável) até a data
    const base = liq, b2 = base * Math.pow(1 + rCdi, weekdays(end, target));
    const ir2 = Math.max(0, b2 - base) * aliqIR(daysBetween(end, target));
    return { bruto: b2, ir: ir + ir2, liquido: b2 - ir2, venceAntes, end };
  }
  return { bruto, ir, liquido: liq, venceAntes, end };
}

      <div class="tiles">
        <div class="tile"><div class="k">Em ${isoBR(cfg.target)} você terá</div><div class="v">${money(totLiq)}</div><div class="s">líquido de IR · hoje ${money(nowLiq)}</div></div>
        <div class="tile"><div class="k">Vai render até lá</div><div class="v up">+${money(totLiq - nowLiq)}</div><div class="s">${nowLiq ? pct((totLiq / nowLiq - 1) * 100) : "—"} em ${yrs >= 1 ? brl(yrs, 1) + " ano" + (yrs >= 2 ? "s" : "") : span + " dias"}</div></div>
        <div class="tile"><div class="k">IR estimado</div><div class="v">${money(totIr)}</div><div class="s">total descontado no resgate</div></div>
      </div>
      <div class="proj-box"><canvas id="proj-chart" aria-label="Evolução projetada da renda fixa"></canvas></div>
      <div class="table-wrap"><table class="w-table">
        <thead><tr><th>Título</th><th>Rentabilidade</th><th>Vencimento</th><th>Líquido hoje</th><th>Bruto em ${isoBR(cfg.target)}</th><th>IR</th><th>Líquido em ${isoBR(cfg.target)}</th><th>Observação</th></tr></thead>
        <tbody>${per.sort((a, b) => b.p.liquido - a.p.liquido).map(({ r, p }) => `<tr>
          <td><span class="tk">${esc(r.nome)}</span> <span class="muted">${esc(r.tipo)}</span></td>
          <td>${rfTaxa(r)}</td><td>${r.venc ? isoBR(r.venc) : "—"}</td>
          <td>${money(r.calc.liquido)}</td><td>${money(p.bruto)}</td>

        </tr>`).join("")}</tbody>
      </table></div>
      <div class="status">É uma estimativa: supõe CDI e IPCA constantes até a data e não desconta feriados. Ações, FIIs e cripto não entram na projeção.</div>
    </div>`;
  }

  if (!rfW.length) projHtml = `<div class="panel"><h2>Projeção da renda fixa</h2>
    <div class="hint" style="margin-top:8px">Você ainda não cadastrou títulos de renda fixa. Cadastre na página <a href="/carteira">Carteira</a> (aba "Renda fixa") para ver a projeção deles.</div></div>`;
  else if (!rates) projHtml = `<div class="panel"><h2>Projeção da renda fixa</h2>

  if (fP) {

      if (e.target.name === "target") projCfg.target = fP.target.value || null;
      if (e.target.name === "cdi") projCfg.cdi = fP.cdi.value === "" ? null : Number(fP.cdi.value);
      if (e.target.name === "ipca") projCfg.ipca = fP.ipca.value === "" ? null : Number(fP.ipca.value);
      if (e.target.name === "reinvest") projCfg.reinvest = fP.reinvest.checked;
      saveProj(); renderProjection();
    };
    fP.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { projCfg.target = addMonths(todayISO(), +b.dataset.m); saveProj(); renderProjection(); });
    $("#proj-reset").onclick = () => { projCfg.cdi = null; projCfg.ipca = null; saveProj(); renderProjection(); };
  }
}

// ---------- Backup ----------
function exportBackup() {
  const payload = {
    app: "painel-acoes", versao: 1, exportadoEm: new Date().toISOString(),
    acoesFiis: wallet, cripto: cryptoW, rendaFixa: rfW, moedas: moedasW, bens: bensW, historico: histW, listaPainel,
    preferencias: { projecao: projCfg, simulador: simCfg, listaPainel },
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `carteira-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importBackup(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch { return alert("Esse arquivo não é um backup válido (JSON inválido)."); }
  if (!d || d.app !== "painel-acoes") return alert("Esse arquivo não parece ser um backup deste painel.");
  const n = k => (d[k] || []).length;
  const resumo = `${n("acoesFiis")} ações/FIIs, ${n("cripto")} cripto, ${n("rendaFixa")} títulos de renda fixa, ${n("moedas")} moedas, ${n("bens")} bens e ${Object.keys(d.historico || {}).length} dias de histórico`;
  if (!confirm(`Importar backup com ${resumo}?\n\nIsso SUBSTITUI todos os seus dados salvos no servidor.`)) return;
  try {
    await sendBackup(d);
  } catch (e) { return alert("O servidor recusou o backup: " + e.message); }
  rfEditId = null; rates = null; // recalcula as taxas a partir das novas datas
  await loadState();
  $("#tickers").value = listaPainel;
  load();
}

// Gráfico de linha simples (1 ou mais séries), com crosshair
function lineChart(canvas, datasets, { fmtY = v => brl(v), fmtTip = v => brl(v), fill = true, height = 150 } = {}) {
  const all = datasets.flatMap(d => d.data);
  if (!all.length) return null;
  const min = Math.min(...all.map(p => p.x)), max = Math.max(...all.map(p => p.x));
  return new Chart(canvas, {
    type: "line",
    data: { datasets: datasets.map((d, i) => {
      let bg = d.color;
      if (fill && i === 0) {
        bg = canvas.getContext("2d").createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, d.color + "33"); bg.addColorStop(1, d.color + "00");
      }
      return { label: d.label, data: d.data, borderColor: d.color, backgroundColor: bg, fill: fill && i === 0, borderWidth: 2,
        borderDash: d.dash || [], pointRadius: d.data.length < 8 ? 3 : 0, pointBackgroundColor: d.color, pointHoverRadius: 4,
        pointHoverBorderColor: css("--surface"), pointHoverBorderWidth: 2, tension: 0.2 };
    }) },
    options: {
      maintainAspectRatio: false, animation: false, parsing: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tooltipOpts(), displayColors: datasets.length > 1,
        callbacks: { title: i => new Date(i[0].parsed.x).toLocaleDateString("pt-BR"), label: i => (datasets.length > 1 ? " " + i.dataset.label + ": " : "") + fmtTip(i.parsed.y) } } },
      scales: {
        x: { type: "linear", min, max, grid: { display: false }, border: { display: false }, ticks: { ...tickOpts(), maxTicksLimit: 5, callback: timeTicks(min, max) } },
        y: { position: "right", grid: gridOpts(), border: { display: false }, ticks: { ...tickOpts(), maxTicksLimit: 4, callback: fmtY } },
      },
    },
    plugins: [crosshair],
  });
}

// ---------- Projeção: simulador de aportes ----------
function simulate(cfg) {
  const nominal = Math.pow(1 + cfg.taxa / 100, 1 / 12) - 1;
  const r = cfg.real ? Math.pow((1 + cfg.taxa / 100) / (1 + cfg.inflacao / 100), 1 / 12) - 1 : nominal;
  let saldo = cfg.inicial, aportado = cfg.inicial, mMeta = null, mRenda = null;
  const rows = [{ m: 0, saldo, aportado }];
  for (let m = 1; m <= 600; m++) {
    saldo = saldo * (1 + r) + cfg.aporte;
    aportado += cfg.aporte;
    rows.push({ m, saldo, aportado });
    if (mMeta == null && cfg.meta && saldo >= cfg.meta) mMeta = m;
    if (mRenda == null && cfg.renda && saldo * r >= cfg.renda) mRenda = m;
  }
  return { rows, r, mMeta, mRenda };
}
const fmtPrazo = m => { const a = Math.floor(m / 12), mm = m % 12; return [a ? `${a} ano${a > 1 ? "s" : ""}` : "", mm ? `${mm} ${mm > 1 ? "meses" : "mês"}` : ""].filter(Boolean).join(" e ") || "agora"; };
const mesAno = m => { const d = new Date(); d.setMonth(d.getMonth() + m); return d.toLocaleDateString("pt-BR", { month: "short", year: "numeric" }); };

function simulatorHtml() {
  const lastSnap = Object.keys(histW).sort().pop();

  const cfg = { aporte: 1000, meta: 1000000, renda: 5000, real: true, ...simCfg };
  for (const k of ["inicial", "taxa", "inflacao"]) if (cfg[k] == null) cfg[k] = def[k];
  const sim = simulate(cfg);
  const horizon = Math.min(600, Math.max(120, Math.max(sim.mMeta || 0, sim.mRenda || 0) + 24));
  const rows = sim.rows.slice(0, horizon + 1);
  const unit = cfg.real ? " (em reais de hoje)" : "";
  const marcos = [1, 5, 10, 15, 20, 25, 30, 40, 50].filter(a => a * 12 <= horizon);
  const html = `<div class="panel">
    <h2>Simulador de aportes</h2>
    <div class="hint">Quanto você terá aportando todo mês, e quando chega na sua meta de patrimônio ou de renda mensal.</div>
    <form class="w-add proj-form" id="f-sim">
      <label>Valor inicial (R$)<input type="number" name="inicial" min="0" step="100" value="${cfg.inicial}"></label>
      <label>Aporte mensal (R$)<input type="number" name="aporte" min="0" step="50" value="${cfg.aporte}"></label>

    <div class="tiles">
      <div class="tile"><div class="k">Meta de ${money(cfg.meta)}</div><div class="v">${sim.mMeta != null ? fmtPrazo(sim.mMeta) : "—"}</div><div class="s">${sim.mMeta != null ? "em " + mesAno(sim.mMeta) : "não atinge em 50 anos"}</div></div>
      <div class="tile"><div class="k">Renda de ${money(cfg.renda)}/mês</div><div class="v">${sim.mRenda != null ? fmtPrazo(sim.mRenda) : "—"}</div><div class="s">${sim.mRenda != null ? `em ${mesAno(sim.mRenda)}, com ${money(sim.rows[sim.mRenda].saldo)}` : "não atinge em 50 anos"}</div></div>
      <div class="tile"><div class="k">Em 10 anos${unit}</div><div class="v">${money(sim.rows[120].saldo)}</div><div class="s">aportado ${money(sim.rows[120].aportado)} · rendimentos ${money(sim.rows[120].saldo - sim.rows[120].aportado)}</div></div>
    </div>
    ${legendHtml([["Patrimônio" + unit, css("--s1")], ["Total aportado", css("--s2"), true]])}
    <div class="proj-box"><canvas id="sim-chart" aria-label="Evolução simulada do patrimônio"></canvas></div>
    <div class="table-wrap"><table class="w-table">
      <thead><tr><th>Prazo</th><th>Quando</th><th>Patrimônio</th><th>Total aportado</th><th>Rendimentos</th><th>Renda mensal possível</th></tr></thead>
      <tbody>${marcos.map(a => { const x = sim.rows[a * 12]; return `<tr><td>${a} ano${a > 1 ? "s" : ""}</td><td>${mesAno(a * 12)}</td><td><b>${money(x.saldo)}</b></td><td>${money(x.aportado)}</td><td>${money(x.saldo - x.aportado)}</td><td>${money(x.saldo * sim.r)}</td></tr>`; }).join("")}</tbody>
    </table></div>
    <div class="status">Simulação com rentabilidade constante, aporte no fim de cada mês e sem IR. "Renda mensal possível" = quanto o patrimônio rende por mês${cfg.real ? " acima da inflação" : ""}.</div>
  </div>`;
  const start = new Date(); start.setDate(1);
  const tx = m => { const d = new Date(start); d.setMonth(d.getMonth() + m); return d.getTime(); };
  const series = [
    { label: "Patrimônio", color: css("--s1"), data: rows.map(r => ({ x: tx(r.m), y: r.saldo })) },
    { label: "Total aportado", color: css("--s2"), dash: [5, 4], data: rows.map(r => ({ x: tx(r.m), y: r.aportado })) },
  ];
  return { html, series, def };
}
function bindSimulator(def) {
  const f = $("#f-sim"); if (!f) return;
  f.onchange = e => {
    const n = e.target.name; if (!n) return;
    simCfg[n] = n === "real" ? e.target.checked : (e.target.value === "" ? null : Number(e.target.value));
    saveSim(); renderProjection();
  };
  $("#sim-reset").onclick = () => { simCfg.inicial = null; simCfg.taxa = null; simCfg.inflacao = null; saveSim(); renderProjection(); };
}

    <div class="hint" style="margin-top:6px">O painel guarda uma "foto" do seu patrimônio por dia, sempre que você abre a Carteira. ${days.length ? `A primeira foi em ${isoBR(days[0])}; o gráfico aparece a partir do segundo dia.` : "A primeira será salva quando todos os valores carregarem."}</div></div>`;

  const delta = (a, b) => `<span class="${signCls(b - a)}">${b - a > 0 ? "+" : b - a < 0 ? "−" : ""}${money(Math.abs(b - a))}</span> <span class="muted">${a ? pct((b / a - 1) * 100) : ""}</span>`;
  return `<div class="panel"><h2>Evolução do patrimônio</h2>
    <div class="hint">Uma foto por dia em que você abriu a Carteira. Inclui aportes e retiradas, então não é só rentabilidade.</div>
    <div class="tiles">
      <div class="tile"><div class="k">Desde ${isoBR(days[0])}</div><div class="v" style="font-size:16px">${delta(first.t, last.t)}</div><div class="s">patrimônio total</div></div>
      ${d30 ? `<div class="tile"><div class="k">Últimos 30 dias</div><div class="v" style="font-size:16px">${delta(histW[d30].t, last.t)}</div><div class="s">patrimônio total</div></div>` : ""}
      <div class="tile"><div class="k">Registros</div><div class="v">${days.length}</div><div class="s">dias salvos</div></div>
    </div>

}
function drawHistory() {
