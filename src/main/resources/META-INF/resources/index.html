// ---------- Gráficos da carteira ----------
let walletCats = [], walletTotal = 0;
function breakdownTip() {
  let t = document.getElementById("bk-tip");
  if (!t) { t = document.createElement("div"); t.id = "bk-tip"; t.setAttribute("role", "tooltip"); document.body.appendChild(t); }
  return t;
}
function showBreakdown(i, x, y) {
  const c = walletCats[i]; if (!c) return;
  const t = breakdownTip();
  const items = [...c.items].sort((a, b) => b.value - a.value);
  t.innerHTML = `<div class="bk-h"><i style="background:var(${c.color})"></i>${c.name}<span>${money(c.value)} · ${brl(c.value / walletTotal * 100, 1)}%</span></div>
    ${c.note ? `<div class="bk-n">${esc(c.note)}</div>` : ""}
    ${items.map(it => `<div class="bk-r"><span class="bk-name">${esc(it.name)} <span class="muted">${esc(it.sub || "")}</span></span>
      <span class="bk-v">${money(it.value)}</span><span class="bk-p">${brl(it.value / c.value * 100, 1)}%</span>
      <span class="bk-bar"><span style="width:${it.value / c.value * 100}%;background:var(${c.color})"></span></span></div>`).join("")}`;
  t.style.display = "block";
  const w = t.offsetWidth, h = t.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left = x + 16, top = y + 12;
  if (left + w > vw - 8) left = Math.max(8, x - w - 16);
  if (top + h > vh - 8) top = Math.max(8, vh - h - 8);
  t.style.left = left + "px"; t.style.top = top + "px";
}
const hideBreakdown = () => { const t = document.getElementById("bk-tip"); if (t) t.style.display = "none"; };

function drawPie(cats) {
  const canvas = $("#pie");
  const ch = new Chart(canvas, {
    type: "doughnut",
    data: { labels: cats.map(c => c.name), datasets: [{ data: cats.map(c => c.value), backgroundColor: cats.map(c => css(c.color)),
      borderColor: css("--surface"), borderWidth: 2, hoverOffset: 6, borderRadius: 3 }] },
    options: {
      cutout: "64%", maintainAspectRatio: false, animation: false, layout: { padding: 8 },
      plugins: { legend: { display: false }, tooltip: { enabled: false, external: ({ chart, tooltip }) => {
        if (!tooltip.opacity || !tooltip.dataPoints?.length) return hideBreakdown();
        const r = chart.canvas.getBoundingClientRect();
        showBreakdown(tooltip.dataPoints[0].dataIndex, r.left + tooltip.caretX, r.top + tooltip.caretY);
      } } },
    },
  });
  canvas.onmouseleave = hideBreakdown;
  walletCharts.push(ch);
  document.querySelectorAll(".pl-row").forEach(row => {
    const i = +row.dataset.cat;
    const on = () => { ch.setActiveElements([{ datasetIndex: 0, index: i }]); ch.update("none"); const b = row.getBoundingClientRect(); showBreakdown(i, b.right - 40, b.top); };
    const off = () => { ch.setActiveElements([]); ch.update("none"); hideBreakdown(); };
    row.onmouseenter = on; row.onfocus = on; row.onmouseleave = off; row.onblur = off;
  });
}

function drawProjection(series) {
  const min = series[0].x, max = series[series.length - 1].x;
  const c = css("--s2");
  const ctx = $("#proj-chart");
  const grad = ctx.getContext("2d").createLinearGradient(0, 0, 0, 220);
  grad.addColorStop(0, c + "33"); grad.addColorStop(1, c + "00");
  projCharts.push(new Chart(ctx, {
    type: "line",
    data: { datasets: [{ data: series, borderColor: c, backgroundColor: grad, fill: true, borderWidth: 2, pointRadius: 0,
      pointHoverRadius: 4, pointHoverBackgroundColor: c, pointHoverBorderColor: css("--surface"), pointHoverBorderWidth: 2, tension: 0.2 }] },
    options: {
      maintainAspectRatio: false, animation: false, parsing: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tooltipOpts(), displayColors: false,
        callbacks: { title: i => new Date(i[0].parsed.x).toLocaleDateString("pt-BR"), label: i => money(i.parsed.y) + " líquido" } } },
      scales: {
        x: { type: "linear", min, max, grid: { display: false }, border: { color: css("--border") }, ticks: { ...tickOpts(), maxTicksLimit: 6, callback: timeTicks(min, max) } },
        y: { grid: gridOpts(), border: { display: false }, ticks: { ...tickOpts(), maxTicksLimit: 5, callback: v => "R$ " + big(v) } },
      },
    },
    plugins: [crosshair],
  }));
}

function renderWallet() {
  const el = $("#wallet");
  // Ações e FIIs
  const rv = wallet.map(w => {
    const it = byTicker[w.t];
    const cur = it?.currency || "BRL", rate = fxRate(cur); // ações do exterior: converte para reais
    const ok = it && !it.error && it.price != null && rate != null;
    const price = it && !it.error ? it.price : null;
    const chg = !ok ? null : it.change != null ? it.change : it.changePct != null ? price - price / (1 + it.changePct / 100) : null;
    return { kind: "rv", t: w.t, q: w.q, type: it?.type || "", cur, ok, err: it?.error, price, value: ok ? w.q * price * rate : null,
      dayChg: chg != null ? chg * w.q * rate : null, div12: ok ? (it.div12m || 0) * w.q * rate : null };
  });
  // Cripto
  const cr = cryptoW.map(c => {
    const p = cryptoPrices[c.t];
    const chg = p && p.changePct != null ? p.price - p.price / (1 + p.changePct / 100) : null;
    return { kind: "cr", t: c.t, q: c.q, type: "Cripto", ok: !!p, price: p?.price ?? null, value: p ? c.q * p.price : null,
      dayChg: chg != null ? chg * c.q : null, div12: null };
  });
  // Renda fixa
  const rf = rfW.map(e => ({ ...e, calc: rfCalc(e) }));
  // Moedas estrangeiras e bens
  const mo = moedasW.map(m => {
    const q = fx?.quotes?.[m.c], value = q ? m.q * q.bid : null;
    return { ...m, ok: !!q, rate: q?.bid, value, dayChg: q ? value - value / (1 + q.pct / 100) : null };
  });
  const bens = bensW.map(b => ({ ...b, value: bemValue(b) }));

  const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
  const vAcoes = sum(rv.filter(r => r.type !== "FII"), r => r.value);
  const vFiis = sum(rv.filter(r => r.type === "FII"), r => r.value);
  const vCripto = sum(cr, r => r.value);
  const vRf = sum(rf, r => r.calc?.liquido);
  const vFx = sum(mo, r => r.value);
  const vBens = sum(bens, r => r.value);
  const vExt = sum(rv.filter(r => r.type === "Exterior"), r => r.value);
  const total = vAcoes + vFiis + vCripto + vRf + vFx; // investimentos
  const patrimonio = total + vBens;
  const dayTotal = sum([...rv, ...cr, ...mo], r => r.dayChg);
  const varBase = vAcoes + vFiis + vCripto + vFx - dayTotal;
  const dayPct = varBase ? dayTotal / varBase * 100 : null;
  const div12 = sum(rv, r => r.div12);
  const rfRend = sum(rf, r => r.calc ? r.calc.liquido - r.aplicado : 0);
  const rfAplic = sum(rf, r => r.aplicado);
  const share = v => total && v ? v / total * 100 : 0;
  const classes = [["Ações", vAcoes, "--s1"], ["FIIs", vFiis, "--s2"], ["Renda fixa", vRf, "--s3"], ["Cripto", vCripto, "--s4"]].filter(c => c[1] > 0);
  const empty = !wallet.length && !cryptoW.length && !rfW.length && !moedasW.length && !bensW.length;
  const allocCell = v => `<div class="alloc">${v ? brl(share(v), 1) + "%" : "—"}<div class="track"><div class="fill" style="width:${share(v)}%"></div></div></div>`;
  const signedMoney = v => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + money(Math.abs(v));

  const tiles = empty ? "" : `
    <div class="tiles">
      <div class="tile"><div class="k">Patrimônio total</div><div class="v">${money(patrimonio)}</div><div class="s">${rfW.length && !rates ? "sem a renda fixa (aguardando taxas)" : vBens ? `investimentos ${money(total)} + bens ${money(vBens)}` : "renda fixa líquida de IR"}</div></div>
      ${vBens ? `<div class="tile"><div class="k">Investimentos</div><div class="v">${money(total)}</div><div class="s">sem contar bens</div></div>` : ""}
      <div class="tile"><div class="k">Hoje (renda variável)</div><div class="v ${signCls(dayTotal)}">${arrow(dayTotal)} ${money(Math.abs(dayTotal))}</div><div class="s ${signCls(dayPct)}">${pct(dayPct)}</div></div>
      <div class="tile"><div class="k">Proventos 12 meses</div><div class="v">${money(div12)}</div><div class="s">${money(div12 / 12)} por mês · DY ${vAcoes + vFiis ? brl(div12 / (vAcoes + vFiis) * 100) + "%" : "—"}</div></div>
      ${rfW.length ? `<div class="tile"><div class="k">Rendimento renda fixa</div><div class="v ${signCls(rfRend)}">${rates ? signedMoney(rfRend) : "—"}</div><div class="s">líquido · ${rfAplic ? pct(rfRend / rfAplic * 100) : "—"} sobre ${money(rfAplic)}</div></div>` : ""}
    </div>`;

  // Rosca: renda variável × renda fixa × cripto
  const cats = [
    { key: "rv", name: "Renda variável", color: "--s1", value: vAcoes + vFiis,
      items: rv.filter(r => r.value).map(r => ({ name: r.t, sub: r.type, value: r.value })),
      note: vAcoes + vFiis ? `Ações ${money(vAcoes - vExt)} · FIIs ${money(vFiis)}${vExt ? ` · Exterior ${money(vExt)}` : ""}` : "" },
    { key: "rf", name: "Renda fixa", color: "--s2", value: vRf,
      items: rf.filter(r => r.calc).map(r => ({ name: r.nome, sub: rfTaxa(r), value: r.calc.liquido })), note: "valores líquidos de IR" },
    { key: "cr", name: "Cripto", color: "--s3", value: vCripto,
      items: cr.filter(r => r.value).map(r => ({ name: r.t, sub: brl(r.q, 8).replace(/0+$/, "").replace(/,$/, ""), value: r.value })), note: "" },
    { key: "fx", name: "Moedas", color: "--s4", value: vFx,
      items: mo.filter(r => r.value).map(r => ({ name: r.c, sub: moneyC(r.q, r.c), value: r.value })), note: "valores convertidos para reais" },
  ].filter(c => c.value > 0);
  walletCats = cats; walletTotal = total;
  const dist = !cats.length ? "" : `
    <div class="dist">
      <div class="pie-box"><canvas id="pie" aria-label="Divisão da carteira"></canvas>
        <div class="pie-center"><div class="k">Total</div><div class="v">${money(total)}</div></div></div>
      <div class="pie-legend">
        <div class="hint" style="margin:0 0 4px">Passe o mouse em uma fatia ou categoria para ver os ativos.${vBens ? ` Bens (${money(vBens)}) não entram no gráfico.` : ""}</div>
        ${cats.map((c, i) => `<div class="pl-row" data-cat="${i}" tabindex="0">
          <i style="background:var(${c.color})"></i><span class="pl-name">${c.name}</span>
          <span class="pl-val">${money(c.value)}</span><span class="pl-pct">${brl(share(c.value), 1)}%</span></div>`).join("")}
      </div>
    </div>`;

  const rvRows = [...rv, ...cr].sort((a, b) => (b.value || 0) - (a.value || 0));
  const accHead = (k, title, n, v, [um, varios] = ["ativo", "ativos"]) => `<summary><span class="acc-t">${title}</span><span class="acc-s">${n} ${n === 1 ? um : varios} · ${money(v)} · ${brl(share(v), 1)}%</span></summary>`;
  const rvTable = !rvRows.length ? "" : `
    <details class="acc" data-acc="rv" ${accOpen("rv") ? "open" : ""}>${accHead("rv", "Ações, FIIs e cripto", rvRows.length, vAcoes + vFiis + vCripto)}
    <div class="table-wrap"><table class="w-table">
      <thead><tr><th>Ativo</th><th>Quantidade</th><th>Preço</th><th>Valor</th><th>% da carteira</th><th>Hoje</th><th>Proventos 12m</th><th>Por mês</th><th></th></tr></thead>
      <tbody>${rvRows.map(r => `<tr>
        <td><span class="tk">${esc(r.t)}</span> <span class="muted">${esc(r.type)}</span></td>
        <td><input type="number" min="0" step="${r.kind === "cr" ? "any" : "1"}" value="${r.q}" data-q="${esc(r.t)}" data-kind="${r.kind}"></td>
        <td>${r.price != null ? moneyC(r.price, r.cur || "BRL") : `<span class="muted">${r.err ? "não encontrado" : "carregando…"}</span>`}</td>
        <td>${money(r.value)}</td>
        <td>${allocCell(r.value)}</td>
        <td class="${signCls(r.dayChg)}" ${r.kind === "cr" ? 'title="Variação em 24 horas"' : ""}>${signedMoney(r.dayChg)}${r.kind === "cr" && r.dayChg != null ? ' <span class="muted">24h</span>' : ""}</td>
        <td>${r.div12 ? money(r.div12) : "—"}</td>
        <td>${r.div12 ? money(r.div12 / 12) : "—"}</td>
        <td><button class="x" title="Remover" data-rm-w="${esc(r.t)}" data-kind="${r.kind}">×</button></td>
      </tr>`).join("")}</tbody>
    </table></div></details>`;

  const rfTable = !rf.length ? "" : `
    <details class="acc" data-acc="rf" ${accOpen("rf") ? "open" : ""}>${accHead("rf", "Renda fixa", rf.length, vRf, ["título", "títulos"])}
    <div class="table-wrap"><table class="w-table">
      <thead><tr><th>Título</th><th>Rentabilidade</th><th>Aplicado</th><th>Aplicação</th><th>Vencimento</th><th>Valor bruto</th><th>IR</th><th>Valor líquido</th><th>Rendimento líq.</th><th>% da carteira</th><th></th></tr></thead>
      <tbody>${rf.sort((a, b) => (b.calc?.liquido || 0) - (a.calc?.liquido || 0)).map(r => {
        const c = r.calc, rendLiq = c ? c.liquido - r.aplicado : null;
        return `<tr class="${r.id === rfEditId ? "editing" : ""}">
        <td><span class="tk">${esc(r.nome)}</span> <span class="muted">${esc(r.tipo)}</span></td>
        <td>${rfTaxa(r)}</td>
        <td>${money(r.aplicado)}</td>
        <td>${isoBR(r.data)}</td>
        <td>${r.venc ? isoBR(r.venc) + (c?.venceu ? ' <span class="muted">(venceu)</span>' : "") : "—"}</td>
        <td>${c ? money(c.bruto) : `<span class="muted">${ratesErr ? "sem taxas" : "calculando…"}</span>`}</td>
        <td>${c ? (r.isento ? '<span class="muted">isento</span>' : `${money(c.ir)} <span class="muted">${brl(c.aliq * 100, 1)}%</span>`) : "—"}</td>
        <td>${c ? money(c.liquido) : "—"}</td>
        <td class="${signCls(rendLiq)}">${c ? `${signedMoney(rendLiq)} <span class="muted">${pct(rendLiq / r.aplicado * 100)}</span>` : "—"}</td>
        <td>${allocCell(c?.liquido)}</td>
        <td style="white-space:nowrap"><button class="x" title="Editar" data-ed-rf="${esc(r.id)}">✎</button><button class="x" title="Remover" data-rm-rf="${esc(r.id)}">×</button></td>
      </tr>`; }).join("")}</tbody>
    </table></div></details>`;

  const today = todayISO();
  const forms = {
    rv: `<form class="w-add" id="f-rv">
        <input name="t" placeholder="Ticker (ex.: BBDC4, AAPL)" autocomplete="off" spellcheck="false" required style="text-transform:uppercase">
        <input name="q" type="number" min="0" step="1" placeholder="Quantidade" required>
        <button class="primary" type="submit">Adicionar</button>
        <span class="status">Ações americanas (ex.: AAPL, MSFT) entram convertidas pelo dólar do dia. Se já estiver na carteira, a quantidade é substituída.</span></form>`,
    cr: `<form class="w-add" id="f-cr">
        <select name="t">${COINS.map(c => `<option>${c}</option>`).join("")}</select>
        <input name="q" type="number" min="0" step="any" placeholder="Quantidade (ex.: 0,015)" required>
        <button class="primary" type="submit">Adicionar</button>
        <span class="status">Preço em reais pelo CoinGecko. Se já estiver na carteira, a quantidade é substituída.</span></form>`,
    rf: `<form class="w-add rf-form" id="f-rf">
        <label>Nome<input name="nome" placeholder="Ex.: CDB Banco Inter" required></label>
        <label>Tipo<select name="tipo">${RF_TIPOS.map(t => `<option>${t}</option>`).join("")}</select></label>
        <label>Rentabilidade<span class="pair"><select name="idx"><option value="cdi">% do CDI</option><option value="pre">Prefixado % a.a.</option><option value="ipca">IPCA + % a.a.</option></select>
          <input name="taxa" type="number" step="any" min="0" placeholder="Ex.: 110" required></span></label>
        <label>Valor aplicado (R$) — quanto saiu da sua conta no dia<input name="aplicado" type="number" step="0.01" min="0" required></label>
        <label>Data da aplicação<input name="data" type="date" max="${today}" required></label>
        <label>Vencimento<input name="venc" type="date"></label>
        <label class="chk"><input name="isento" type="checkbox"> Isento de IR</label>
        ${rfEditId ? `<span class="pair"><button class="primary" type="submit">Salvar alterações</button><button type="button" id="rf-cancel">Cancelar</button></span>` : `<button class="primary" type="submit">Adicionar</button>`}</form>
        <div class="status" style="margin-top:6px">${rfEditId ? "<b>Editando um título.</b> " : ""}Valor estimado "na curva" com o CDI e o IPCA do Banco Central, descontando o IR (tabela regressiva). Não considera IOF (só vale para menos de 30 dias) nem a marcação a mercado do Tesouro.</div>`,
  };

  el.innerHTML = `<div class="panel">
    <div class="w-head">
      <div><h2>Minha carteira</h2><div class="hint" style="margin:0">Salva no servidor: disponível em qualquer dispositivo. Proventos estimados com base no que foi pago nos últimos 12 meses.</div></div>
      <div class="w-actions">
        ${wallet.length ? `<button id="w-show">Ver ações e FIIs em Ativos</button>` : ""}
        <button id="w-export" ${empty ? "disabled" : ""}>Exportar backup</button>
        <button id="w-import">Importar backup</button>
        <input type="file" id="w-file" accept=".json,application/json" hidden>
      </div>
    </div>
    ${[cryptoErr, ratesErr].filter(Boolean).map(m => `<div class="err" style="margin-top:8px">${esc(m)}</div>`).join("")}
    ${tiles}
    ${dist}
    ${empty ? `<div class="hint" style="margin-top:8px">Sua carteira está vazia. Adicione algo abaixo.</div>` : ""}
    ${rvTable}
    ${rfTable}
    ${mo.length ? `<details class="acc" data-acc="fx" ${accOpen("fx") ? "open" : ""}>${accHead("fx", "Moedas", mo.length, vFx, ["moeda", "moedas"])}
      <div class="table-wrap"><table class="w-table"><thead><tr><th>Moeda</th><th>Quantidade</th><th>Cotação</th><th>Valor</th><th>% da carteira</th><th>Hoje</th></tr></thead>
      <tbody>${mo.map(r => `<tr><td><span class="tk">${r.c}</span></td><td>${moneyC(r.q, r.c)}</td><td>${r.ok ? "R$ " + brl(r.rate, fxDec(r.c)) : "—"}</td><td>${money(r.value)}</td><td>${allocCell(r.value)}</td><td class="${signCls(r.dayChg)}">${signedMoney(r.dayChg)}</td></tr>`).join("")}</tbody></table></div>
      <div class="status">Para alterar, use a página <a href="/moedas">Moedas</a>.</div></details>` : ""}
    ${bens.length ? `<details class="acc" data-acc="bens" ${accOpen("bens") ? "open" : ""}><summary><span class="acc-t">Bens</span><span class="acc-s">${bens.length} · ${money(vBens)} · fora dos investimentos</span></summary>
      <div class="table-wrap"><table class="w-table"><thead><tr><th>Bem</th><th>Ano</th><th>Código FIPE</th><th>Referência</th><th>Valor FIPE</th></tr></thead>
      <tbody>${bens.map(b => `<tr><td><span class="tk">${esc(bemNome(b))}</span> <span class="muted">${esc(b.info?.model || "")}</span></td><td>${esc(String(b.info?.modelYear || ""))}</td><td>${esc(b.info?.codeFipe || "")}</td><td>${esc(b.last?.month || "")}</td><td>${money(b.value)}</td></tr>`).join("")}</tbody></table></div>
      <div class="status">Para adicionar ou remover, use a página <a href="/bens">Bens</a>.</div></details>` : ""}
    <h3>Adicionar</h3>
    <div class="seg" id="add-tabs">
      <button data-tab="rv" class="${addTab === "rv" ? "on" : ""}">Ação / FII</button><button data-tab="cr" class="${addTab === "cr" ? "on" : ""}">Cripto</button><button data-tab="rf" class="${addTab === "rf" ? "on" : ""}">Renda fixa</button>
    </div>
    ${forms[addTab]}
  </div>
  ${empty ? "" : historyPanelHtml()}`;

  walletCharts.forEach(c => c.destroy());
  walletCharts = [];
  el.querySelectorAll("details.acc").forEach(d => d.ontoggle = () => store.set("acc_" + d.dataset.acc, d.open ? "1" : "0"));
  if (cats.length) drawPie(cats);
  // Foto diária do patrimônio (só quando todos os valores carregaram)
  const complete = !empty && rv.every(r => r.ok) && cr.every(r => r.ok) && mo.every(r => r.ok) && (!rfW.length || rates) && bens.every(b => b.value != null);
  if (complete) {
    const snap = { t: patrimonio, i: total, rv: vAcoes + vFiis, rf: vRf, cr: vCripto, fx: vFx, bens: vBens };
    const isNew = !histW[todayISO()];
    histW[todayISO()] = Object.fromEntries(Object.entries(snap).map(([k, v]) => [k, Math.round(v * 100) / 100]));
    saveHist();
    if (isNew && Object.keys(histW).length === 2) return renderWallet(); // agora já dá para desenhar o gráfico
  }
  drawHistory();

  // --- eventos
  $("#add-tabs").onclick = e => { const t = e.target.dataset.tab; if (t) { addTab = t; rfEditId = null; store.set("addTab", t); renderWallet(); } };
  $("#w-export").onclick = exportBackup;
  $("#w-import").onclick = () => $("#w-file").click();
  $("#w-file").onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); };
  const show = $("#w-show");
  if (show) show.onclick = () => { location.href = "/ativos#" + encodeURIComponent(wallet.map(w => w.t).join(",")); };

  const fRv = $("#f-rv");
  if (fRv) fRv.onsubmit = e => {
    e.preventDefault();
    const t = parseTickers(fRv.t.value)[0], q = Number(fRv.q.value);
    if (!t || !(q >= 0)) return;
    const ex = wallet.find(w => w.t === t);
    ex ? ex.q = q : wallet.push({ t, q });
    saveWallet();
    byTicker[t] ? renderWallet() : load();
  };
  const fCr = $("#f-cr");
  if (fCr) fCr.onsubmit = async e => {
    e.preventDefault();
    const t = fCr.t.value, q = Number(fCr.q.value);
    if (!(q >= 0)) return;
    const ex = cryptoW.find(c => c.t === t);
    ex ? ex.q = q : cryptoW.push({ t, q });
    saveCrypto(); await loadExtras(); renderWallet();
  };
  const fRf = $("#f-rf");
  if (fRf) {
    const syncTipo = () => {
      const t = fRf.tipo.value;
      fRf.isento.checked = RF_ISENTOS.includes(t);
      if (t === "Tesouro Selic") { fRf.idx.value = "cdi"; fRf.taxa.value = 100; }
      if (t === "Tesouro Prefixado") fRf.idx.value = "pre";
      if (t === "Tesouro IPCA+") fRf.idx.value = "ipca";
    };
    fRf.tipo.onchange = syncTipo;
    const editing = rfEditId && rfW.find(x => x.id === rfEditId);
    if (editing) {
      for (const k of ["nome", "tipo", "idx", "taxa", "aplicado", "data"]) fRf[k].value = editing[k];
      fRf.venc.value = editing.venc || "";
      fRf.isento.checked = !!editing.isento;
      $("#rf-cancel").onclick = () => { rfEditId = null; renderWallet(); };
    }
    fRf.onsubmit = async e => {
      e.preventDefault();
      const entry = {
        nome: fRf.nome.value.trim(), tipo: fRf.tipo.value, idx: fRf.idx.value,
        taxa: Number(fRf.taxa.value), aplicado: Number(fRf.aplicado.value), data: fRf.data.value,
        venc: fRf.venc.value || null, isento: fRf.isento.checked,
      };
      const ex = rfEditId && rfW.find(x => x.id === rfEditId);
      if (ex) Object.assign(ex, entry); else rfW.push({ id: Date.now().toString(36), ...entry });
      rfEditId = null;
      saveRf(); await loadExtras(); renderWallet();
    };
  }
  el.querySelectorAll("[data-q]").forEach(inp => inp.onchange = () => {
    const list = inp.dataset.kind === "cr" ? cryptoW : wallet;
    const w = list.find(w => w.t === inp.dataset.q);
    w.q = Math.max(0, Number(inp.value) || 0);
    inp.dataset.kind === "cr" ? saveCrypto() : saveWallet();
    renderWallet();
  });
  el.querySelectorAll("[data-rm-w]").forEach(b => b.onclick = () => {
    if (b.dataset.kind === "cr") { cryptoW = cryptoW.filter(c => c.t !== b.dataset.rmW); saveCrypto(); }
    else { wallet = wallet.filter(w => w.t !== b.dataset.rmW); saveWallet(); }
    renderWallet();
  });
  el.querySelectorAll("[data-ed-rf]").forEach(b => b.onclick = () => {
    rfEditId = b.dataset.edRf; addTab = "rf"; renderWallet();
    $("#f-rf").scrollIntoView({ behavior: "smooth", block: "center" });
  });
  el.querySelectorAll("[data-rm-rf]").forEach(b => b.onclick = () => {
    const e = rfW.find(x => x.id === b.dataset.rmRf);
    if (e && !confirm(`Remover "${e.nome}" da carteira?`)) return;
    if (rfEditId === b.dataset.rmRf) rfEditId = null;
    rfW = rfW.filter(x => x.id !== b.dataset.rmRf); saveRf(); renderWallet();
  });
}

// ---------- Render ----------
function render() {
  charts.forEach(c => c.destroy());
  charts = [];
  const ok = data.filter(d => !d.error);
  const bad = data.filter(d => d.error);
  const app = $("#app");
  if (!data.length) { app.innerHTML = `<div class="panel muted">Digite alguns tickers acima.</div>`; return; }

  app.innerHTML = `
    ${bad.length ? `<div class="panel err">Não encontrei: ${bad.map(b => esc(b.ticker)).join(", ")}</div>` : ""}
    ${ok.some(d => d.warnings?.length) ? `<div class="panel err">${[...new Set(ok.flatMap(d => d.warnings || []))].map(esc).join("<br>")}<br><span class="muted">Usando o Yahoo como reserva para esses ativos.</span></div>` : ""}
    <div class="panel">
      <h2>Comparativo de desempenho</h2>
      <div class="hint">Variação do preço em ${RANGE_LABEL[range]}, todos partindo de 0% (não inclui proventos). Clique na legenda para esconder/mostrar.</div>
      <div class="legend" id="cmp-legend"></div>
      <div class="cmp-box"><canvas id="cmp"></canvas></div>
    </div>
    <div class="panel">
      <h2>Resumo</h2>
      <div class="hint">Clique no cabeçalho para ordenar. DY, P/L, P/VP e ROE vêm do Fundamentus (DY = proventos dos últimos 12 meses ÷ preço).</div>
      <div class="table-wrap"><table id="tbl"></table></div>
    </div>
    <div class="grid" id="cards"></div>`;

  renderLegend(ok);
  renderCompare(ok);
  renderTable(ok);
  renderCards(ok);
}

const gridOpts = () => ({ color: css("--grid"), drawTicks: false });
const tickOpts = () => ({ color: css("--text-3"), font: { size: 11 }, padding: 6 });
const tooltipOpts = () => ({
  backgroundColor: css("--surface"), titleColor: css("--text"), bodyColor: css("--text-2"),
  borderColor: css("--border"), borderWidth: 1, padding: 10, boxPadding: 4, usePointStyle: true,
});
function timeTicks(min, max) {
  const spanDays = (max - min) / 864e5;
  return v => {
    const d = new Date(v);
    if (spanDays > 400) return d.toLocaleDateString("pt-BR", { month: "short", year: "2-digit" });
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
  };
}
// Linha vertical acompanhando o mouse
const crosshair = {
  id: "crosshair",
  afterDraw(chart) {
    const a = chart.tooltip?.getActiveElements?.();
    if (!a || !a.length) return;
    const x = a[0].element.x, { top, bottom } = chart.chartArea, ctx = chart.ctx;
    ctx.save(); ctx.strokeStyle = css("--text-3"); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke(); ctx.restore();
  },
};

function renderLegend(ok) {
  const el = $("#cmp-legend");
  el.innerHTML = ok.map(it => `<span data-s="${esc(it.symbol)}" class="${hidden.has(it.symbol) ? "off" : ""}"><i style="background:${color(it.idx)}"></i>${esc(it.ticker)} <b class="${signCls(it.ret)}">${pct(it.ret, 1)}</b></span>`).join("");
  el.onclick = e => {
    const s = e.target.closest("span")?.dataset.s; if (!s) return;
    hidden.has(s) ? hidden.delete(s) : hidden.add(s);
    e.target.closest("span").classList.toggle("off");
    const ch = charts[0];
    ch.data.datasets.forEach(ds => ds.hidden = hidden.has(ds.sym));
    ch.update();
  };
}

function renderCompare(ok) {
  const all = ok.flatMap(it => it.points);
  if (!all.length) return;
  const min = Math.min(...all.map(p => p[0])), max = Math.max(...all.map(p => p[0]));
  const datasets = ok.map(it => {
    const base = it.points[0]?.[1];
    return {
      sym: it.symbol, label: it.ticker, hidden: hidden.has(it.symbol),
      data: it.points.map(([t, c]) => ({ x: t, y: (c / base - 1) * 100 })),
      borderColor: color(it.idx), backgroundColor: color(it.idx),
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, pointHoverBorderWidth: 2,
      pointHoverBorderColor: css("--surface"), tension: 0.15,
    };
  });
  charts.push(new Chart($("#cmp"), {
    type: "line",
    data: { datasets },
    options: {
      maintainAspectRatio: false, animation: false, parsing: false,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { ...tooltipOpts(), mode: "index", intersect: false, itemSort: (a, b) => b.parsed.y - a.parsed.y,
          callbacks: { title: i => fmtDate(i[0].parsed.x), label: c => ` ${c.dataset.label}: ${pct(c.parsed.y)}` } },
      },
      scales: {
        x: { type: "linear", min, max, grid: { display: false }, border: { color: css("--border") }, ticks: { ...tickOpts(), maxTicksLimit: 7, callback: timeTicks(min, max) } },
        y: { grid: gridOpts(), border: { display: false }, ticks: { ...tickOpts(), callback: v => v + "%" } },
      },
    },
    plugins: [crosshair],
  }));
}

const COLS = [
  { k: "ticker", l: "Ticker", f: it => `<span class="tk"><span class="dot" style="background:${color(it.idx)}"></span>${esc(it.ticker)}</span>`, s: it => it.ticker },
  { k: "type", l: "Tipo", f: it => `<span class="muted">${esc(it.type)}${it.industry ? " · " + esc(it.industry) : ""}</span>`, s: it => it.type + (it.industry || "") },
  { k: "price", l: "Preço", f: it => moneyC(it.price, it.currency) },
  { k: "changePct", l: "Dia", f: it => `<span class="${signCls(it.changePct)}">${arrow(it.changePct)} ${pct(it.changePct)}</span>` },
  { k: "ret", l: "Período", f: it => `<span class="${signCls(it.ret)}">${pct(it.ret)}</span>` },
  { k: "dy12m", l: "DY 12m", f: it => it.dy12m ? brl(it.dy12m * 100) + "%" : "—" },
  { k: "roe", l: "ROE", f: it => nz(it.fund?.roe) != null ? brl(it.fund.roe * 100, 1) + "%" : "—", s: it => nz(it.fund?.roe) },
  { k: "div12m", l: "Proventos 12m", f: it => it.div12m ? moneyC(it.div12m, it.currency) : "—" },
  { k: "pe", l: "P/L", f: it => it.type === "FII" || !it.pe ? "—" : brl(it.pe) },
  { k: "pvp", l: "P/VP", f: it => it.pvp ? brl(it.pvp) : "—" },
  { k: "pos52", l: "Mín–Máx 52s", f: it => `${brl(it.low52)} – ${brl(it.high52)}`, s: it => it.high52 > it.low52 ? (it.price - it.low52) / (it.high52 - it.low52) : null },
  { k: "marketCap", l: "Valor de mercado", f: it => big(it.marketCap) },
  { k: "volume", l: "Volume", f: it => big(it.volume) },
];

function renderTable(ok) {
  const rows = [...ok];
  if (sortKey) {
    const col = COLS.find(c => c.k === sortKey);
    const val = it => col.s ? col.s(it) : (sortKey === "pe" && it.type === "FII" ? null : it[sortKey]);
    rows.sort((a, b) => {
      const x = val(a), y = val(b);
      if (x == null) return 1; if (y == null) return -1;
      const r = typeof x === "string" ? x.localeCompare(y) : x - y;
      return sortAsc ? r : -r;
    });
  }
  const t = $("#tbl");
  t.innerHTML = `<thead><tr>${COLS.map(c => `<th data-k="${c.k}" class="${c.k === sortKey ? "sorted" + (sortAsc ? " asc" : "") : ""}">${c.l}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(it => `<tr>${COLS.map(c => `<td>${c.f(it)}</td>`).join("")}</tr>`).join("")}</tbody>`;
  t.onclick = e => {
    const k = e.target.closest("th")?.dataset.k; if (!k) return;
    if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = k === "ticker" || k === "type"; }
    renderTable(ok);
  };
}

function renderCards(ok) {
  const wrap = $("#cards");
  ok.forEach(it => {
    const c = color(it.idx);
    const pos = it.high52 > it.low52 ? Math.min(100, Math.max(0, (it.price - it.low52) / (it.high52 - it.low52) * 100)) : 50;
    const divs = it.dividends || [];
    const last = divs[divs.length - 1];
    const f = it.fund || {};
    const isFII = it.type === "FII";
    const pctv = (v, d = 1) => nz(v) != null ? brl(v * 100, d) + "%" : "—";
    const stats = isFII ? [
      ["DY 12m", it.dy12m ? brl(it.dy12m * 100) + "%" : "—"],
      ["P/VP", it.pvp ? brl(it.pvp) : "—"],
      ["Último provento", last ? moneyC(last.amount, it.currency) : "—"],
      ["Vacância", f.vacancia != null ? brl(f.vacancia * 100, 1) + "%" : "—"],
      ["Nº de imóveis", nz(f.imoveis) != null ? brl(f.imoveis, 0) : "—"],
      ["Cap rate", pctv(f.capRate)],
      ["No período", `<span class="${signCls(it.ret)}">${pct(it.ret)}</span>`],
      ["Valor de mercado", big(it.marketCap)],
      ["Liquidez diária", nz(f.liquidez) != null ? "R$ " + big(f.liquidez) : big(it.volume)],
    ] : [
      ["DY 12m", it.dy12m ? brl(it.dy12m * 100) + "%" : "—"],
      ["P/L", it.pe ? brl(it.pe) : "—"],
      ["P/VP", it.pvp ? brl(it.pvp) : "—"],
      ["ROE", pctv(f.roe)],
      ["Margem líquida", pctv(f.margemLiq)],
      ["EV/EBITDA", nz(f.evEbitda) != null ? brl(f.evEbitda) : "—"],
      ["No período", `<span class="${signCls(it.ret)}">${pct(it.ret)}</span>`],
      ["Dív. líq./Patrim.", nz(f.divLiqPatrim) != null ? brl(f.divLiqPatrim) : "—"],
      ["Último provento", last ? moneyC(last.amount, it.currency) : "—"],
      ["Valor de mercado", big(it.marketCap)],
      ["Volume (ações)", big(it.volume)],
      ["Cresc. receita 5a", pctv(f.crescRec5a)],
    ];
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="card-head">
        <div style="min-width:0">
          <div class="tk" style="font-size:17px">${it.logo ? `<img class="logo" src="${esc(it.logo)}" alt="" onerror="this.remove()">` : ""}<span class="dot" style="background:${c}"></span>${esc(it.ticker)} <span class="badge">${esc(it.type)}</span></div>
          <div class="name" title="${esc(it.name)}">${esc(it.name)}</div>
          <div class="name muted">${esc(it.sector || "")}${it.industry ? (it.sector ? " · " : "") + esc(it.industry) : ""}</div>
        </div>
        <div style="display:flex;align-items:flex-start">
          <div>
            <div class="price">${moneyC(it.price, it.currency)}</div>
            <div class="chg ${signCls(it.changePct)}">${arrow(it.changePct)} ${pct(it.changePct)} hoje</div>
          </div>
          <button class="x" title="Remover" data-rm="${esc(it.ticker)}">×</button>
        </div>
      </div>
      <div class="mini"><canvas></canvas></div>
      <div>
        <div class="range52">Faixa de 52 semanas</div>
        <div class="bar52"><b style="left:${pos}%"></b></div>
        <div class="range52 bar52-l"><span>${moneyC(it.low52, it.currency)}</span><span>${moneyC(it.high52, it.currency)}</span></div>
      </div>
      <div class="stats">${stats.map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
      ${divs.length ? `<details class="divs"><summary>Proventos (últimos 2 anos · ${divs.length} pagamentos)</summary><div class="divbox"><canvas></canvas></div></details>` : ""}
      ${it.summary ? `<details><summary>${isFII ? "Sobre o fundo" : "Sobre a empresa"}</summary><div class="about">${esc(it.summary)}</div></details>` : ""}
      <div class="range52">Gráfico: ${esc(it.sources?.grafico || "—")} · cotação: ${esc(it.sources?.cotacao || "—")} · indicadores: ${esc(it.sources?.indicadores || "—")}</div>`;
    wrap.appendChild(el);

    // Gráfico de preço
    const pts = it.points.map(([x, y]) => ({ x, y }));
    if (pts.length) {
      const min = pts[0].x, max = pts[pts.length - 1].x;
      const ctx = el.querySelector(".mini canvas");
      const grad = ctx.getContext("2d").createLinearGradient(0, 0, 0, 150);
      grad.addColorStop(0, c + "33"); grad.addColorStop(1, c + "00");
      charts.push(new Chart(ctx, {
        type: "line",
        data: { datasets: [{ data: pts, borderColor: c, backgroundColor: grad, fill: true, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: c, pointHoverBorderColor: css("--surface"), pointHoverBorderWidth: 2, tension: 0.15 }] },
        options: {
          maintainAspectRatio: false, animation: false, parsing: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: false }, tooltip: { ...tooltipOpts(), displayColors: false,
            callbacks: { title: i => fmtDate(i[0].parsed.x), label: i => moneyC(i.parsed.y, it.currency) + "  (" + pct((i.parsed.y / pts[0].y - 1) * 100) + " no período)" } } },
          scales: {
            x: { type: "linear", min, max, grid: { display: false }, border: { display: false }, ticks: { ...tickOpts(), maxTicksLimit: 4, callback: timeTicks(min, max) } },
            y: { position: "right", grid: gridOpts(), border: { display: false }, ticks: { ...tickOpts(), maxTicksLimit: 4, callback: v => brl(v) } },
          },
        },
        plugins: [crosshair],
      }));
    }

    // Gráfico de proventos (criado ao abrir)
    const det = el.querySelector("details.divs");
    if (divs.length && det) det.addEventListener("toggle", () => {
      if (!det.open || det._chart) return;
      det._chart = new Chart(det.querySelector("canvas"), {
        type: "bar",
        data: { labels: divs.map(d => fmtDate(d.date)), datasets: [{ data: divs.map(d => d.amount), backgroundColor: c, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: "bottom", maxBarThickness: 18, categoryPercentage: .85, barPercentage: .9 }] },
        options: {
          maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { ...tooltipOpts(), displayColors: false, callbacks: { label: i => moneyC(i.parsed.y, it.currency) + " por cota/ação" } } },
          scales: {
            x: { grid: { display: false }, border: { color: css("--border") }, ticks: { ...tickOpts(), maxTicksLimit: 6, maxRotation: 0 } },
            y: { grid: gridOpts(), border: { display: false }, ticks: { ...tickOpts(), maxTicksLimit: 4, callback: v => brl(v, 2) } },
          },
        },
      });
      charts.push(det._chart);
    });
  });

  wrap.onclick = e => {
    const t = e.target.closest("[data-rm]")?.dataset.rm; if (!t) return;
    const list = $("#tickers").value.split(/[,\s;]+/).filter(s => s && s.toUpperCase() !== t);
    $("#tickers").value = list.join(", ");
    load();
  };
}

// ---------- Login (Cognito + Google, authorization code com PKCE) ----------
// Só vale no deploy: localmente /api/auth/config responde {enabled:false} e nada disso roda.
// Access token fica só em memória; o refresh token (30 dias) fica no localStorage para não pedir login toda vez.
let auth = { enabled: false }, accessToken = null, tokenExp = 0, refreshing = null;
let semRede = false; // a última tentativa de renovar o login falhou por falta de internet
const nativeFetch = window.fetch.bind(window);
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const randomStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
const redirectUri = () => location.origin + "/";
const jwtPayload = t => { try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch { return {}; } };

async function tokenRequest(params) {
  const r = await nativeFetch(auth.domain + "/oauth2/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: auth.clientId, ...params }),
  });
  if (!r.ok) throw new Error("token " + r.status);
  const t = await r.json();
  accessToken = t.access_token;
  tokenExp = Date.now() + (t.expires_in || 3600) * 1000;
  if (t.refresh_token) store.set("auth_refresh", t.refresh_token);
  if (t.id_token) store.set("auth_email", jwtPayload(t.id_token).email || "");
}
async function login() {
  const verifier = randomStr(48), state = randomStr(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  sessionStorage.setItem("pkce", JSON.stringify({ verifier, state, back: location.pathname + location.hash }));
  location.assign(auth.domain + "/oauth2/authorize?" + new URLSearchParams({
    response_type: "code", client_id: auth.clientId, redirect_uri: redirectUri(), identity_provider: "Google",
    scope: "openid email profile", state, code_challenge: challenge, code_challenge_method: "S256",
  }));
  return new Promise(() => {}); // a página vai sair daqui
}
function logout() {
  store.set("auth_refresh", ""); store.set("auth_email", "");
  navigator.serviceWorker?.controller?.postMessage("limpar-dados"); // apaga os dados guardados para uso offline
  location.assign(auth.domain + "/logout?" + new URLSearchParams({ client_id: auth.clientId, logout_uri: redirectUri() }));
}
async function refreshTokens() {
  const rt = store.get("auth_refresh", "");
  if (!rt) { accessToken = null; return; }
  refreshing ??= tokenRequest({ grant_type: "refresh_token", refresh_token: rt })
    .then(() => { semRede = false; })
    .catch(e => {
      accessToken = null;
      // TypeError = sem internet: mantém o login guardado e usa os dados salvos
      if (e instanceof TypeError) semRede = true; else store.set("auth_refresh", "");
    })
    .finally(() => { refreshing = null; });
  return refreshing;
}
async function initAuth() {
  auth = await (await nativeFetch("/api/auth/config")).json();
  if (!auth.enabled) return;
  const url = new URL(location.href), code = url.searchParams.get("code");
  if (code) { // voltando do Cognito
    const saved = JSON.parse(sessionStorage.getItem("pkce") || "{}");
    sessionStorage.removeItem("pkce");
    if (saved.state !== url.searchParams.get("state")) throw new Error("login inválido (state)");
    await tokenRequest({ grant_type: "authorization_code", code, redirect_uri: redirectUri(), code_verifier: saved.verifier });
    const back = saved.back && saved.back !== "/" ? saved.back : null;
    if (back) { location.replace(back); return new Promise(() => {}); }
    history.replaceState(null, "", "/");
  }
  if (!accessToken) await refreshTokens();
  if (!accessToken && !semRede) return login();
  $("#user-email").textContent = store.get("auth_email", "");
  $("#user-box").hidden = false;
  $("#logout").onclick = e => { e.preventDefault(); logout(); };
}
// Toda chamada a /api/* leva o token; se expirar (401), renova e tenta de novo uma vez.
// Sem internet, a requisição segue sem token e o service worker responde com os últimos dados salvos.
window.fetch = async (input, init = {}) => {
  const url = typeof input === "string" ? input : input.url;
  if (!url.startsWith("/api/")) return nativeFetch(input, init);
  const r = await apiFetch(url, input, init);
  marcarOffline(r);
  return r;
};
async function apiFetch(url, input, init) {
  if (!auth.enabled || url.startsWith("/api/auth/")) return nativeFetch(input, init);
  if (!accessToken || Date.now() > tokenExp - 60_000) await refreshTokens();
  if (!accessToken) return semRede ? nativeFetch(input, init) : login();
  const call = () => nativeFetch(input, { ...init, headers: { ...(init.headers || {}), Authorization: "Bearer " + accessToken } });
  let r = await call();
  if (r.status === 401) {
    await refreshTokens();
    if (!accessToken) return semRede ? r : login();
    r = await call();
  }
  return r;
}
function marcarOffline(r) {
  const salvoEm = r.headers.get("X-Painel-Offline");
  const bar = $("#offline-bar");
  if (salvoEm === null) { bar.hidden = true; return; }
  const d = salvoEm ? new Date(salvoEm) : null;
  bar.textContent = "Sem internet: mostrando os dados salvos" + (d ? ` em ${d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}` : "") + ". Alterações não serão salvas.";
  bar.hidden = false;
}

// ---------- Persistência no servidor ----------
// A carteira é um documento único em /api/carteira, com controle de versão por ETag:
// cada PUT manda If-Match com a versão lida; se outro dispositivo salvou antes, o servidor responde 412.
let carteiraEtag = null;          // null = ainda não existe no servidor
let persistTimer = null, persistChain = Promise.resolve(), lastSnapSent = null;
const etagOf = r => (r.headers.get("ETag") || "").replace(/"/g, "") || null;

function carteiraDoc() {
  return { acoesFiis: wallet, cripto: cryptoW, rendaFixa: rfW, moedas: moedasW, bens: bensW,
    preferencias: { projecao: projCfg, simulador: simCfg, listaPainel } };
}
function applyCarteira(d) {
  wallet = d.acoesFiis || []; cryptoW = d.cripto || []; rfW = d.rendaFixa || []; moedasW = d.moedas || []; bensW = d.bens || [];
  const p = d.preferencias || {};
  projCfg = { reinvest: true, ...(p.projecao || {}) };
  simCfg = { ...SIM_DEFAULT, ...(p.simulador || {}) };
  if (typeof p.listaPainel === "string" && p.listaPainel.trim()) listaPainel = p.listaPainel;
}
function setSaveState(state, msg = "") {
  const el = $("#save-state");
  el.className = "status " + state;
  el.textContent = { pendente: "Salvando…", ok: "Salvo ✓", erro: "Erro ao salvar: " + msg }[state] || "";
  if (state === "ok") setTimeout(() => { if (el.textContent === "Salvo ✓") el.textContent = ""; }, 2500);
}
// Junta alterações em sequência (400 ms) num PUT só; os PUTs saem um de cada vez
function persist() {
  clearTimeout(persistTimer);
  setSaveState("pendente");
  persistTimer = setTimeout(() => { persistChain = persistChain.then(doPersist); }, 400);
}
async function doPersist() {
  const headers = { "Content-Type": "application/json" };
  if (carteiraEtag) headers["If-Match"] = `"${carteiraEtag}"`; else headers["If-None-Match"] = "*";
  try {
    const r = await fetch("/api/carteira", { method: "PUT", headers, body: JSON.stringify(carteiraDoc()) });
    if (r.status === 412) {
      setSaveState("erro", "conflito");
      alert("Seus dados foram alterados em outro dispositivo. A página vai recarregar com a versão mais recente.");
      return location.reload();
    }
    if (!r.ok) throw new Error(await errorText(r));
    carteiraEtag = etagOf(r);
    setSaveState("ok");
  } catch (e) { setSaveState("erro", e.message); }
}
async function errorText(r) {
  const j = await r.json().catch(() => ({}));
  if (j.error) return j.error;
  if (j.violations?.length) return j.violations.map(v => `${v.field.split(".").slice(2).join(".")}: ${v.message}`).join("; ");
  return "HTTP " + r.status;
}
// Foto do dia: só envia se mudou desde o último envio
function saveSnapshotToday() {
  const d = todayISO(), snap = histW[d];
  if (!snap || JSON.stringify(snap) === lastSnapSent) return;
  lastSnapSent = JSON.stringify(snap);
  fetch(`/api/historico/${d}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: lastSnapSent })
    .then(r => { if (!r.ok) lastSnapSent = null; }).catch(() => { lastSnapSent = null; });
}
async function sendBackup(payload) {
  const r = await fetch("/api/backup/import", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  if (!r.ok) throw new Error(await errorText(r));
}

// Dados antigos deste navegador (versão com localStorage), no formato do backup
function legacyBackup() {
  const arr = k => { try { return JSON.parse(store.get(k, "[]")) || []; } catch { return []; } };
  const obj = k => { try { return JSON.parse(store.get(k, "{}")) || {}; } catch { return {}; } };
  const b = { app: "painel-acoes", versao: 1, acoesFiis: arr("carteira"), cripto: arr("carteira_cripto"), rendaFixa: arr("carteira_rf"),
    moedas: arr("carteira_moedas"), bens: arr("carteira_bens"), historico: obj("historico_patrimonio"),
    listaPainel: store.get("tickers", ""), preferencias: { projecao: obj("projecao"), simulador: obj("simulador") } };
  const temDados = b.acoesFiis.length || b.cripto.length || b.rendaFixa.length || b.moedas.length || b.bens.length || Object.keys(b.historico).length;
  return temDados ? b : null;
}

async function loadState() {
  let r = await fetch("/api/carteira");
  if (r.status === 404) {
    const legado = store.get("migrado", "0") === "1" ? null : legacyBackup();
    if (legado && confirm("Encontrei uma carteira salva neste navegador (versão antiga).\n\nQuer enviá-la para o servidor? Assim ela fica disponível em qualquer dispositivo.")) {
      await sendBackup(legado);
      store.set("migrado", "1");
      r = await fetch("/api/carteira");
    } else if (legado) {
      store.set("migrado", "1"); // não perguntar de novo
    }
  }
  if (r.ok) { applyCarteira(await r.json()); carteiraEtag = etagOf(r); }
  else if (r.status !== 404) throw new Error(await errorText(r));
  const h = await fetch("/api/historico");
  histW = h.ok ? await h.json() : {};
  lastSnapSent = histW[todayISO()] ? JSON.stringify(histW[todayISO()]) : null;
}

// ---------- Inicialização ----------
$("#go").onclick = load;
$("#tickers").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
$("#ranges").onclick = e => {
  const r = e.target.dataset.r; if (!r) return;
  range = r; store.set("range", r); load();
};
let timer;
$("#auto").checked = store.get("auto", "0") === "1";
const setAuto = () => { clearInterval(timer); store.set("auto", $("#auto").checked ? "1" : "0"); if ($("#auto").checked) timer = setInterval(load, 15 * 60 * 1000); };
$("#auto").onchange = setAuto;
setAuto();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderPage);
// mostra só o que é da página atual
document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.dataset.page === PAGE));
document.title = { carteira: "Carteira", projecao: "Projeção", ativos: "Ativos", moedas: "Moedas", bens: "Bens" }[PAGE] + " · Meus Investimentos";
const pageEls = { carteira: ["#wallet"], projecao: ["#projection"], ativos: ["#ativos-controls", "#app"], moedas: ["#moedas"], bens: ["#bens"] };
for (const [pg, sels] of Object.entries(pageEls)) sels.forEach(sel => $(sel).hidden = pg !== PAGE);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
(async () => {
  try {
    await initAuth();
    await loadState();
  } catch (e) {
    $("#" + { carteira: "wallet", projecao: "projection", ativos: "app", moedas: "moedas", bens: "bens" }[PAGE]).innerHTML =
      `<div class="panel err">Não consegui carregar seus dados do servidor (${esc(e.message)}). Recarregue a página em instantes.</div>`;
    return;
  }
  $("#tickers").value = (PAGE === "ativos" && decodeURIComponent(location.hash.slice(1)).replace(/,/g, ", ")) || listaPainel;
  load();
})();
</script>
