# ---------------------------------------------------------------- servidor
quarkus.http.port=8765
quarkus.http.host=127.0.0.1
quarkus.banner.enabled=false

# ---------------------------------------------------------------- painel
# Token da brapi.dev: vem da variável BRAPI_TOKEN (ou do arquivo .env na pasta de onde o app roda).
painel.brapi.token=${BRAPI_TOKEN:}
# Últimas taxas do Banco Central, usadas quando a API deles está fora do ar.
painel.rates-cache-file=cache_taxas.json

# ---------------------------------------------------------------- dados do usuário
# file = pasta local (desenvolvimento); s3 = bucket (produção, ver template SAM)
painel.storage.type=${PAINEL_STORAGE_TYPE:file}
painel.storage.dir=data
painel.storage.bucket=${PAINEL_STORAGE_BUCKET:}
quarkus.s3.sync-client.type=url
# Sem Docker aqui: não subir LocalStack automaticamente
quarkus.s3.devservices.enabled=false

# ---------------------------------------------------------------- login
# Local: sem login (dono fixo "default"). No Lambda (perfil "lambda"): /api/* exige token do Cognito.
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false
quarkus.ssm.devservices.enabled=false
quarkus.ssm.sync-client.type=url
painel.auth.config-param=${PAINEL_AUTH_CONFIG_PARAM:}

%lambda.quarkus.oidc.tenant-enabled=true
%lambda.quarkus.oidc.application-type=service
%lambda.quarkus.oidc.auth-server-url=https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}
%lambda.quarkus.oidc.token.principal-claim=sub
%lambda.quarkus.http.auth.permission.publico.paths=/api/auth/config
%lambda.quarkus.http.auth.permission.publico.policy=permit
%lambda.quarkus.http.auth.permission.api.paths=/api/*
%lambda.quarkus.http.auth.permission.api.policy=authenticated
# Localmente (host 127.0.0.1) o Quarkus só aceita Host local (proteção contra DNS rebinding).
# No Lambda as requisições chegam pela Function URL, com o Host dela.
%lambda.quarkus.http.host-validation.require-localhost=false
# O Lambda só pode gravar em /tmp
%lambda.painel.rates-cache-file=/tmp/cache_taxas.json

# ---------------------------------------------------------------- REST clients
quarkus.rest-client.brapi.url=https://brapi.dev
quarkus.rest-client.yahoo.url=https://query1.finance.yahoo.com
quarkus.rest-client.fundamentus.url=https://www.fundamentus.com.br
quarkus.rest-client.coingecko.url=https://api.coingecko.com
quarkus.rest-client.bcb.url=https://api.bcb.gov.br
quarkus.rest-client.awesomeapi.url=https://economia.awesomeapi.com.br
quarkus.rest-client.fipe.url=https://fipe.parallelum.com.br
quarkus.rest-client.connect-timeout=10000
quarkus.rest-client.read-timeout=20000
quarkus.rest-client.bcb.read-timeout=30000

# ---------------------------------------------------------------- caches (Caffeine)
# Exceções nunca são cacheadas: uma falha numa fonte é tentada de novo na próxima requisição.
quarkus.cache.caffeine."brapi-quote".expire-after-write=5M
quarkus.cache.caffeine."yahoo-chart".expire-after-write=5M
quarkus.cache.caffeine."yahoo-history".expire-after-write=30M
quarkus.cache.caffeine."fundamentus".expire-after-write=1H
quarkus.cache.caffeine."crypto".expire-after-write=2M
quarkus.cache.caffeine."rates".expire-after-write=6H
quarkus.cache.caffeine."fx-last".expire-after-write=2M
quarkus.cache.caffeine."fx-history".expire-after-write=1H
quarkus.cache.caffeine."fipe-lists".expire-after-write=7D
quarkus.cache.caffeine."fipe-refs".expire-after-write=1D
quarkus.cache.caffeine."fipe-price".expire-after-write=12H

# ---------------------------------------------------------------- testes
%test.quarkus.http.test-port=8799
%test.painel.rates-cache-file=target/cache_taxas_test.json
%test.painel.storage.dir=target/test-data
