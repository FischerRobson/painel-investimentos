AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Investments dashboard: Quarkus on Lambda (Function URL + SnapStart), data on S3,
  Google login through Cognito restricted to allowed e-mails, daily wallet snapshot at 18:00 Brasília time.

Parameters:
  GoogleClientId:
    Type: String
    Description: Google OAuth client ID (Google Cloud Console > APIs & Services > Credentials)
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth client secret
  AllowedEmails:
    Type: String
    Description: Comma-separated e-mails allowed to sign up
  BrapiToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: brapi.dev token (empty = quotes from Yahoo only)
  AppVersion:
    Type: String
    Default: dev
    AllowedPattern: "^(dev|\\d+\\.\\d+\\.\\d+)$"
    Description: App version (pom.xml), written to the description of each published Lambda version

Resources:
  # ------------------------------------------------------------------ data
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # deleting the stack keeps your data
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled             # every write keeps the previous version (free backup)
      LifecycleConfiguration:
        Rules:
          - Id: limpa-versoes-antigas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SomenteHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ------------------------------------------------------------------ login
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Rejects sign-ups from e-mails outside the allow list
      Runtime: python3.13
      Handler: index.handler
      Timeout: 5
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref PreSignUpLogGroup
      Environment:
        Variables:
          ALLOWED_EMAILS: !Ref AllowedEmails
      InlineCode: |
        import os

        def handler(event, context):
            allowed = {e.strip().lower() for e in os.environ["ALLOWED_EMAILS"].split(",") if e.strip()}
            email = (event["request"].get("userAttributes", {}).get("email") or "").strip().lower()
            if email not in allowed:
                raise Exception("Acesso não autorizado para este e-mail")
            return event

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt UserPool.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: painel-investimentos
      UserPoolTier: LITE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # no username/password sign-up; Google login only
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "painel-${AWS::AccountId}"

  # Public client (no secret): the page runs the authorization code flow with PKCE
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: painel-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [Google]
      CallbackURLs: [!GetAtt PainelFunctionUrl.FunctionUrl]
      LogoutURLs: [!GetAtt PainelFunctionUrl.FunctionUrl]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # Read by the function at runtime (passing the client id as an environment variable would create a cycle:
  # function -> client -> function URL -> function)
  AuthConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /painel/auth-config
      Type: String
      Description: Public login configuration for the dashboard
      Value: !Sub '{"clientId":"${UserPoolClient}","domain":"https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com","region":"${AWS::Region}"}'

  # ------------------------------------------------------------------ application
  PainelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Investments dashboard (Quarkus)
      Runtime: java21
      Architectures: [x86_64]
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      CodeUri: target/function.zip
      MemorySize: 512                # new account limit; request an increase in Service Quotas if needed
      Timeout: 120                   # the daily snapshot queries every provider; the first Central Bank call can take ~12 s
      AutoPublishAlias: live         # SnapStart only applies to published versions
      VersionDescription: !Sub "v${AppVersion}"   # shows which app version each Lambda version runs
      SnapStart:
        ApplyOn: PublishedVersions
      FunctionUrlConfig:
        AuthType: NONE               # public; /api/* requires a Cognito token (checked in Quarkus)
      LoggingConfig:
        LogGroup: !Ref PainelLogGroup
      # Daily wallet snapshot. The scheduler invokes the function directly with a Function URL style event for
      # POST /internal/snapshots; the token is the random part of the stack id, known only inside the account.
      Events:
        DailySnapshot:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-daily-snapshot"
            Description: Daily wallet snapshot at 18:00 Brasília time
            ScheduleExpression: cron(0 18 * * ? *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            RetryPolicy:
              MaximumRetryAttempts: 2
            Input: !Sub
              - '{"version":"2.0","routeKey":"$default","rawPath":"/internal/snapshots","rawQueryString":"","headers":{"x-snapshot-token":"${Token}","content-type":"application/json"},"requestContext":{"http":{"method":"POST","path":"/internal/snapshots","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"eventbridge-scheduler"},"requestId":"daily-snapshot","routeKey":"$default","stage":"$default"},"isBase64Encoded":false}'
              - Token: !Select [2, !Split ["/", !Ref AWS::StackId]]
      Environment:
        Variables:
          QUARKUS_PROFILE: lambda
          PAINEL_STORAGE_TYPE: s3
          PAINEL_STORAGE_BUCKET: !Ref DataBucket
          PAINEL_AUTH_CONFIG_PARAM: /painel/auth-config
          COGNITO_USER_POOL_ID: !Ref UserPool
          BRAPI_TOKEN: !Ref BrapiToken
          PAINEL_SNAPSHOT_TOKEN: !Select [2, !Split ["/", !Ref AWS::StackId]]
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
          QUARKUS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Sid: DadosDosUsuarios
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${DataBucket.Arn}/users/*"
            # Without ListBucket S3 answers 403 (not 404) for a file that does not exist yet; the daily snapshot
            # also lists users/. No prefix condition: S3 does not send the prefix on that check, so it would never match.
            - Sid: ListarBucketParaReceber404
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
            - Sid: CustosDaConta
              Effect: Allow
              Action: [ce:GetCostAndUsage, ce:GetCostForecast]
              Resource: "*"
            - Sid: ConfigDoLogin
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/painel/auth-config"

  PainelLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

Outputs:
  Url:
    Description: Dashboard URL
    Value: !GetAtt PainelFunctionUrl.FunctionUrl
  GoogleRedirectUri:
    Description: Register this URL as an "Authorized redirect URI" in the Google OAuth client
    Value: !Sub "https://painel-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  DataBucketName:
    Description: Data bucket (kept even if the stack is deleted)
    Value: !Ref DataBucket
