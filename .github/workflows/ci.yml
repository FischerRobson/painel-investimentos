name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versao:
    name: Versão (maior que a da master)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compara a versão do pom.xml com a da branch de destino
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          git show "origin/$BASE:pom.xml" > "$RUNNER_TEMP/base-pom.xml"
          pr=$(./versao.sh)
          base=$(./versao.sh "$RUNNER_TEMP/base-pom.xml")
          base=${base%%-*}   # 1.0.0-SNAPSHOT conta como 1.0.0
          echo "versão do PR: $pr · versão da $BASE: $base"
          [[ "$pr" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error file=pom.xml::a versão precisa ser X.Y.Z (sem -SNAPSHOT); hoje é '$pr'"; exit 1; }
          maior=$(printf '%s\n%s\n' "$base" "$pr" | sort -V | tail -n1)
          if [[ "$pr" == "$base" || "$maior" != "$pr" ]]; then
            echo "::error file=pom.xml::suba a versão no pom.xml: precisa ser maior que $base (a da $BASE)"
            exit 1
          fi

  backend:
    name: Backend (testes + pacote do Lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes
        run: ./mvnw -B verify
      - name: Pacote do Lambda
        run: ./mvnw -B package -Plambda -DskipTests
      - name: Tamanho do pacote
        run: ls -lh target/function.zip

  infra:
    name: Infraestrutura (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --quiet cfn-lint
      - run: cfn-lint --non-zero-exit-code error template.yaml infra/github-oidc.yaml

  frontend:
    name: Frontend (React, motor e app atual)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - run: npm ci
      - name: Tipos (TypeScript strict)
        run: npm run typecheck
      - name: Testes (Vitest; inclui o motor financeiro)
        run: npm test
      - name: motor.js do app atual gerado a partir do motor.ts
        run: |
          npm run -s motor:legado
          git diff --exit-code -- ../resources/META-INF/resources/motor.js \
            || { echo "::error file=src/main/resources/META-INF/resources/motor.js::motor.js desatualizado: rode 'npm run motor:legado' em src/main/webui e faça commit"; exit 1; }
      - name: App atual (sintaxe do JS inline, PWA e glossário)
        working-directory: .
        run: |
          node --check src/main/resources/META-INF/resources/sw.js
          node --check src/main/resources/META-INF/resources/motor.js
          node .github/scripts/check-frontend.mjs

  e2e:
    name: Ponta a ponta (Playwright, modo demonstração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Pacote do app
        run: ./mvnw -B package -DskipTests
      - name: Dependências e navegador
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Testes
        working-directory: e2e
        run: npx playwright test
      - name: Relatório
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
