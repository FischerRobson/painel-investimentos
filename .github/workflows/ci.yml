name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versao:
    name: Versão (maior que a da master)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compara a versão do pom.xml com a da branch de destino
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          git show "origin/$BASE:pom.xml" > "$RUNNER_TEMP/base-pom.xml"
          pr=$(./versao.sh)
          base=$(./versao.sh "$RUNNER_TEMP/base-pom.xml")
          base=${base%%-*}   # 1.0.0-SNAPSHOT conta como 1.0.0
          echo "versão do PR: $pr · versão da $BASE: $base"
          [[ "$pr" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error file=pom.xml::a versão precisa ser X.Y.Z (sem -SNAPSHOT); hoje é '$pr'"; exit 1; }
          maior=$(printf '%s\n%s\n' "$base" "$pr" | sort -V | tail -n1)
          if [[ "$pr" == "$base" || "$maior" != "$pr" ]]; then
            echo "::error file=pom.xml::suba a versão no pom.xml: precisa ser maior que $base (a da $BASE)"
            exit 1
          fi

  backend:
    name: Backend (testes + pacote do Lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes
        run: ./mvnw -B verify
      - name: Pacote do Lambda
        run: ./mvnw -B package -Plambda -DskipTests
      - name: Tamanho do pacote
        run: ls -lh target/function.zip

  infra:
    name: Infraestrutura (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --quiet cfn-lint
      - run: cfn-lint --non-zero-exit-code error template.yaml infra/github-oidc.yaml

  frontend:
    name: Frontend (sintaxe JS e PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --check src/main/resources/META-INF/resources/sw.js
      - run: node .github/scripts/check-frontend.mjs
