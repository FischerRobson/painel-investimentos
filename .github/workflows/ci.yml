name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + pacote do Lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes
        run: ./mvnw -B verify
      - name: Pacote do Lambda
        run: ./mvnw -B package -Plambda -DskipTests
      - name: Tamanho do pacote
        run: ls -lh target/function.zip

  infra:
    name: Infraestrutura (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --quiet cfn-lint
      - run: cfn-lint --non-zero-exit-code error template.yaml infra/github-oidc.yaml

  frontend:
    name: Frontend (sintaxe JS e PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --check src/main/resources/META-INF/resources/sw.js
      - run: node .github/scripts/check-frontend.mjs
